name: Rename file to index
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rename.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename demo file to index.html
        run: |
          if [ -f demo-web-steakhouse.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git mv demo-web-steakhouse.html index.html
            git commit -m "Rename demo-web-steakhouse.html to index.html"
            git push
          fi
